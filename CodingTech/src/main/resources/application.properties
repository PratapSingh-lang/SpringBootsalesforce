########## Database H2 configuration ############

# 1. Enable SQL logging to see what queries Spring is running
spring.jpa.show-sql=true

# 2. Tell Hibernate to automatically create tables in RAM from your @Entity classes
spring.jpa.hibernate.ddl-auto=update

# 3. Change driver from MySQL to H2
spring.datasource.driver-class-name=org.h2.Driver

# 4. Point the URL to a temporary in-memory instance called 'customerdb'
spring.datasource.url=jdbc:h2:mem:customerdb;DB_CLOSE_DELAY=-1

# 5. Use default H2 credentials (no password required)
spring.datasource.username=sa
spring.datasource.password=

# 6. Change the dialect to a universal H2 dialect instead of MySQL5Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect


server.port = 7777
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
